backend:
  name: github
  repo: 7yptbmvt8d-wq/Kanjo-A-kido
  branch: main

# Dossier où sont déposées les images téléversées (logo, photos…).
media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

publish_mode: editorial_workflow

collections:
  # ---------- RÉGLAGES DU SITE ----------
  - name: reglages
    label: "Réglages du site"
    description: "Coordonnées, réseaux, horaires, tarifs, dojos partenaires."
    files:
      - name: site
        label: "Coordonnées & informations générales"
        file: "src/_data/site.json"
        fields:
          - { label: "Logo (image)", name: logo, widget: image, required: false, hint: "Laisser vide pour garder le logo doré par défaut." }
          - { label: "Lien HelloAsso (inscription)", name: helloasso, widget: string, required: false, hint: "URL de la page d'inscription HelloAsso. Vide = les boutons renvoient vers Contact." }
          - { label: "Lien 'Laisser un avis' (Google)", name: reviewUrl, widget: string, required: false, hint: "URL d'avis de ta fiche Google Business. Fait apparaître un bouton sous les témoignages. Vide = pas de bouton." }
          - { label: "Lien de l'application (PWA)", name: appUrl, widget: string, required: false, hint: "URL de l'application web du dojo. Affiche une section 'Installer l'application' sur l'accueil et un lien dans le pied de page. Vide = masqué." }
          - label: "Marque"
            name: brand
            widget: object
            fields:
              - { label: "Nom (ligne 1)", name: name, widget: string }
              - { label: "Sous-titre (ligne 2)", name: sub, widget: string }
          - label: "Coordonnées"
            name: contact
            widget: object
            fields:
              - { label: "Email", name: email, widget: string }
              - { label: "Téléphone (affiché)", name: phone, widget: string }
              - { label: "Téléphone (format international, ex +33…)", name: phoneIntl, widget: string }
              - { label: "Personne à contacter", name: person, widget: string }
              - { label: "Adresse (rue)", name: address, widget: string }
              - { label: "Ville", name: ville, widget: string }
          - label: "Réseaux sociaux"
            name: social
            widget: object
            fields:
              - { label: "YouTube", name: youtube, widget: string }
              - { label: "Facebook", name: facebook, widget: string }
              - { label: "WhatsApp", name: whatsapp, widget: string }
              - { label: "FFAB", name: ffab, widget: string }
          - { label: "Phrase du bloc partenaires", name: footerLead, widget: text }
          - { label: "Mention de bas de page", name: footerCopy, widget: string }
          - label: "Horaires"
            name: horaires
            widget: list
            fields:
              - { label: "Libellé", name: label, widget: string }
              - { label: "Valeur", name: value, widget: string }
          - label: "Tarifs"
            name: tarifs
            widget: list
            fields:
              - { label: "Nom", name: name, widget: string }
              - { label: "Montant", name: amount, widget: string }
              - { label: "Période", name: period, widget: string }
              - { label: "Mise en avant", name: featured, widget: boolean, default: false }
              - { label: "Détails", name: features, widget: list, field: { label: "Ligne", name: line, widget: string } }
          - label: "Dojos partenaires"
            name: partners
            widget: list
            fields:
              - { label: "Nom", name: name, widget: string }
              - { label: "Lien", name: url, widget: string }

  # ---------- GALERIE PHOTOS ----------
  - name: galerie
    label: "Galerie photos"
    description: "Ajoutez ou retirez les photos de la galerie."
    files:
      - name: galerie
        label: "Photos de la galerie"
        file: "src/_data/galerie.json"
        fields:
          - label: "Saisons"
            name: seasons
            label_singular: "Saison"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre de la saison", name: title, widget: string, hint: "Ex. : Saison 2026 – 2027" }
              - label: "Photos"
                name: photos
                widget: list
                fields:
                  - { label: "Image", name: image, widget: image }
                  - { label: "Légende (texte alternatif)", name: alt, widget: string, required: false }

  # ---------- TEXTES DES PAGES ----------
  - name: pages
    label: "Textes des pages"
    description: "Titres, accroches et paragraphes de chaque page."
    files:
      - name: accueil
        label: "Accueil"
        file: "src/_data/pages/accueil.json"
        fields:
          - { label: "Hero — sur-titre", name: heroEyebrow, widget: string }
          - { label: "Hero — titre", name: heroTitle, widget: string }
          - { label: "Hero — accroche", name: heroLead, widget: text }
          - { label: "Esprit — sur-titre", name: espritEyebrow, widget: string }
          - { label: "Esprit — titre", name: espritTitle, widget: string }
          - { label: "Esprit — texte", name: espritLead, widget: text }
          - { label: "感 Kan — libellé", name: kanLabel, widget: string }
          - { label: "感 Kan — description", name: kanDesc, widget: text }
          - { label: "情 Jo — libellé", name: joLabel, widget: string }
          - { label: "情 Jo — description", name: joDesc, widget: text }
          - { label: "Citation", name: quote, widget: string }
          - { label: "Témoignages — sur-titre", name: testiEyebrow, widget: string, required: false }
          - { label: "Témoignages — titre", name: testiTitle, widget: string, required: false }
          - label: "Témoignages / avis"
            name: testimonials
            label_singular: "Témoignage"
            widget: list
            required: false
            summary: "{{fields.name}} — {{fields.quote}}"
            hint: "Ajoutez, modifiez ou retirez des témoignages d'élèves. Laissez la liste vide pour masquer la section."
            fields:
              - { label: "Note (étoiles)", name: rating, widget: number, required: false, default: 5, value_type: int, min: 1, max: 5, step: 1, hint: "De 1 à 5 étoiles. Laisser vide pour ne pas afficher d'étoiles." }
              - { label: "Témoignage (texte)", name: quote, widget: text }
              - { label: "Prénom / nom", name: name, widget: string }
              - { label: "Rôle (sous le nom)", name: meta, widget: string, required: false, hint: "Ex. : Adhérent débutant, Maman d'un jeune pratiquant." }
          - { label: "Voie — sur-titre", name: voieEyebrow, widget: string }
          - { label: "Voie — titre", name: voieTitle, widget: string }
          - { label: "Voie — paragraphes", name: voieParas, widget: list, field: { label: "Paragraphe", name: p, widget: text } }
      - name: histoire
        label: "Histoire"
        file: "src/_data/pages/histoire.json"
        fields:
          - { label: "Sur-titre", name: eyebrow, widget: string }
          - { label: "Titre", name: title, widget: string }
          - { label: "Accroche", name: lead, widget: text }
          - { label: "Photo — O-Senseï", name: osenseiPhoto, widget: image, required: false }
          - { label: "Photo — Tamura Senseï", name: tamuraPhoto, widget: image, required: false }
          - { label: "O-Senseï — sur-titre", name: osenseiEyebrow, widget: string }
          - { label: "O-Senseï — titre", name: osenseiTitle, widget: string }
          - { label: "O-Senseï — paragraphes", name: osenseiParas, widget: list, field: { label: "Paragraphe", name: p, widget: text } }
          - { label: "Tamura — sur-titre", name: tamuraEyebrow, widget: string }
          - { label: "Tamura — titre", name: tamuraTitle, widget: string }
          - { label: "Tamura — paragraphes", name: tamuraParas, widget: list, field: { label: "Paragraphe", name: p, widget: text } }
      - name: dojo
        label: "Le Dojo"
        file: "src/_data/pages/dojo.json"
        fields:
          - { label: "Sur-titre", name: eyebrow, widget: string }
          - { label: "Titre", name: title, widget: string }
          - { label: "Accroche", name: lead, widget: text }
          - { label: "Comment on pratique — paragraphes", name: pratiqueParas, widget: list, field: { label: "Paragraphe", name: p, widget: text } }
      - name: enseignant
        label: "Enseignant"
        file: "src/_data/pages/enseignant.json"
        fields:
          - { label: "Photo de l'enseignant", name: photo, widget: image, required: false }
          - { label: "Sur-titre", name: eyebrow, widget: string }
          - { label: "Titre", name: title, widget: string }
          - { label: "Nom & grade", name: name, widget: string }
          - { label: "Biographie — paragraphes", name: bioParas, widget: list, field: { label: "Paragraphe", name: p, widget: text } }
          - { label: "Citation", name: quote, widget: string }
          - { label: "Afficher le second enseignant", name: teacher2Show, widget: boolean, default: true }
          - { label: "Second enseignant — photo", name: teacher2Photo, widget: image, required: false }
          - { label: "Second enseignant — sur-titre", name: teacher2Eyebrow, widget: string, required: false }
          - { label: "Second enseignant — nom & grade", name: teacher2Name, widget: string, required: false }
          - { label: "Second enseignant — biographie", name: teacher2Bio, widget: list, required: false, field: { label: "Paragraphe", name: p, widget: text } }
      - name: stages
        label: "Stages"
        file: "src/_data/pages/stages.json"
        fields:
          - { label: "Sur-titre", name: eyebrow, widget: string }
          - { label: "Titre", name: title, widget: string }
          - { label: "Accroche", name: lead, widget: text }
          - { label: "Note", name: note, widget: text }
          - label: "Calendrier des stages"
            name: stages
            label_singular: "Stage / événement"
            widget: list
            summary: "{{fields.date}} — {{fields.title}}"
            hint: "Ajoutez, retirez ou réorganisez les événements (glisser-déposer). Ils s'affichent dans l'ordre de la liste."
            fields:
              - { label: "Date (colonne de gauche)", name: date, widget: string, hint: "Repère court affiché à gauche de la frise. Ex. : 2 SEPT, OCT., DÉC., JUIN…" }
              - { label: "Titre", name: title, widget: string }
              - { label: "Période (du … au …)", name: dates, widget: string, required: false, hint: "Affiché en doré sur la carte. Ex. : Du 12 au 14 décembre 2026. Laisser vide si sans objet." }
              - { label: "Description", name: desc, widget: text, required: false, hint: "Laisser vide pour une simple étape sans texte." }
              - { label: "Info (petit texte sous la description)", name: meta, widget: string, required: false, hint: "Ex. : DOJO · [ VILLE ], À CONFIRMER. Laisser vide si aucune." }
              - { label: "Lien d'inscription / paiement", name: link, widget: string, required: false, hint: "URL (HelloAsso, formulaire…). Un bouton « S'inscrire » apparaît sur la carte. Laisser vide pour aucun bouton." }
              - { label: "Affiche du stage", name: poster, widget: image, required: false, hint: "Image de l'affiche (facultatif). Elle s'affiche sur la carte du stage." }
              - label: "Type d'événement"
                name: type
                widget: select
                required: false
                default: "normal"
                options:
                  - { label: "Stage normal", value: "normal" }
                  - { label: "Événement mis en avant (encadré doré)", value: "featured" }
                  - { label: "Clôture de saison (sans encadré)", value: "end" }
      - name: equiper
        label: "S'équiper"
        file: "src/_data/pages/equiper.json"
        fields:
          - { label: "Sur-titre", name: eyebrow, widget: string }
          - { label: "Titre", name: title, widget: string }
          - { label: "Accroche", name: lead, widget: text }
          - { label: "Note", name: note, widget: text }
          - label: "Éléments"
            name: items
            widget: list
            fields:
              - { label: "Kanji", name: kanji, widget: string }
              - { label: "Titre", name: title, widget: string }
              - { label: "Photo", name: image, widget: image, required: false }
              - { label: "Description", name: desc, widget: text }
      - name: galerie_textes
        label: "Galerie (textes)"
        file: "src/_data/pages/galerie.json"
        fields:
          - { label: "Sur-titre", name: eyebrow, widget: string }
          - { label: "Titre", name: title, widget: string }
          - { label: "Accroche", name: lead, widget: text }
          - { label: "Note", name: note, widget: text }
      - name: contact
        label: "Contact"
        file: "src/_data/pages/contact.json"
        fields:
          - { label: "Sur-titre", name: eyebrow, widget: string }
          - { label: "Titre", name: title, widget: string }
          - { label: "Accroche", name: lead, widget: text }
