name: Déploiement programmé (1er septembre)

# Fusionne release/seo2 dans main le 1er septembre à 06h00 (heure de Paris),
# ce qui déclenche automatiquement le build Netlify de production.
# Déclenchement manuel possible via "Run workflow".
on:
  schedule:
    - cron: "0 4 1 9 *"   # 04:00 UTC = 06:00 Paris (CEST) le 1er septembre
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fusionner release/seo2 dans main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/seo2
          git merge --no-edit origin/release/seo2
          git push origin HEAD:main
